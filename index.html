  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

ne\" href=\"#contact\">Me contacter<\/a><\/div>\n<\/div>\n<\/section>\n\n<section sc-camel-on-pointer-move=\"{{ move }}\" sc-camel-on-pointer-leave=\"{{ leave }}\" class=\"t w\" style=\"grid-column:8/span 5;grid-row:1/span 3;align-items:center;justify-content:center;text-align:center\">\n<svg sc-camel-view-box=\"0 0 120 120\" width=\"92\" height=\"92\" aria-hidden=\"true\"><g stroke=\"#B9A2FF\" stroke-width=\"10\" stroke-linecap=\"round\"><path d=\"M30 30H90M30 90H90M30 30V90M90 30V90\"><\/path><\/g><circle cx=\"30\" cy=\"30\" r=\"17\" fill=\"#2B1470\"><\/circle><circle cx=\"90\" cy=\"30\" r=\"17\" fill=\"#6B3FF0\"><\/circle><circle cx=\"30\" cy=\"90\" r=\"17\" fill=\"#B9A2FF\"><\/circle><circle cx=\"90\" cy=\"90\" r=\"17\" fill=\"#C8F34A\" stroke=\"#170B3B\" stroke-width=\"3\"><\/circle><\/svg>\n<div class=\"name\">Simon Foussat-Ferré<\/div>\n<div class=\"mono\" style=\"opacity:.75\">BUT Informatique + DU Robotique, 2e année<br>IUT de Bordeaux · Saint-Jean-d'Illac (33)<\/div>\n<\/section>\n\n<section sc-camel-on-pointer-move=\"{{ move }}\" sc-camel-on-pointer-leave=\"{{ leave }}\" class=\"t m\" style=\"grid-column:8/span 5;grid-row:4/span 3\">\n<div class=\"badge mono\"><span class=\"dot\" aria-hidden=\"true\"><\/span>Stage en robotique, 8 à 10 semaines, dès janvier<\/div>\n<p style=\"font-size:20px;line-height:1.35;font-weight:600;max-width:26em\">J'aime comprendre un système en entier : l'application, ce qui l'héberge et le capteur qui mesure. J'apprends surtout en construisant.<\/p>\n<\/section>\n\n<article sc-camel-on-pointer-move=\"{{ move }}\" sc-camel-on-pointer-leave=\"{{ leave }}\" class=\"t d\" style=\"grid-column:8/span 5;grid-row:13/span 6\" id=\"projets\">\n<div class=\"meta mono\"><span>2026 · 1 mois<\/span><span>Projet personnel<\/span><\/div>\n<h3>Station météo modulaire<\/h3>\n<p>Mesurer la météo dedans et dehors, sans câble. Deux pods d'acquisition, intérieur et extérieur, envoient leurs relevés en ESP-NOW à très basse latence vers un écran central, avec une visualisation compatible Home Assistant. En place à l'extérieur depuis août 2026.<\/p>\n<div class=\"flow mono push\">pod intérieur + pod extérieur → ESP-NOW → écran central<\/div>\n<ul class=\"tags\"><li>Arduino<\/li><li>ESP-NOW<\/li><li>ESPHome<\/li><li>IoT<\/li><\/ul>\n<a class=\"mono\" href=\"https://github.com/komafeu007/Weather-station\">github.com/komafeu007/Weather-station<\/a>\n<\/article>\n\n<article sc-camel-on-pointer-move=\"{{ move }}\" sc-camel-on-pointer-leave=\"{{ leave }}\" class=\"t w\" style=\"grid-column:4/span 4;grid-row:7/span 6\">\n<div class=\"meta mono\"><span>2026<\/span><span>Académique, équipe de 5<\/span><\/div>\n<h3>Visualisation météo et incidents climatiques<\/h3>\n<p>Analyse de données météo et d'incidents climatiques, dont les feux de forêt, à partir de bases de données de l'État. Le traitement et la base sont séparés de l'affichage client. J'ai pris en charge la gestion statistique.<\/p>\n<div class=\"flow mono push\">SQL → Python (back) → C# (front)<\/div>\n<ul class=\"tags\"><li>Python<\/li><li>C#<\/li><li>SQL<\/li><li>Statistiques<\/li><\/ul>\n<\/article>\n\n<article sc-camel-on-pointer-move=\"{{ move }}\" sc-camel-on-pointer-leave=\"{{ leave }}\" class=\"t l\" style=\"grid-column:1/span 3;grid-row:7/span 6\">\n<div class=\"meta mono\"><span>2026<\/span><span>Hackathon<\/span><\/div>\n<h3>Robot autonome de labyrinthe<\/h3>\n<p>Un véhicule trouve seul la sortie d'un labyrinthe physique. Un LiDAR perçoit l'espace, des roues holonomes le déplacent dans toutes les directions.<\/p>\n<ul class=\"tags push\"><li>Python<\/li><li>LiDAR<\/li><li>Holonome<\/li><\/ul>\n<\/article>\n\n<article sc-camel-on-pointer-move=\"{{ move }}\" sc-camel-on-pointer-leave=\"{{ leave }}\" class=\"t v\" style=\"grid-column:8/span 5;grid-row:7/span 6\">\n<div class=\"meta mono\"><span>2023 — 2026<\/span><span>Projet personnel<\/span><\/div>\n<h3>Serveur domestique et domotique<\/h3>\n<p>Une ancienne machine reconditionnée sous Proxmox. Des conteneurs Docker hébergent un NAS (OpenMediaVault), un serveur multimédia et Home Assistant, pour automatiser la maison.<\/p>\n<div class=\"flow mono push\">Proxmox → Docker → NAS · médias · domotique<\/div>\n<ul class=\"tags\"><li>Proxmox<\/li><li>Docker<\/li><li>OMV<\/li><li>Home Assistant<\/li><\/ul>\n<\/article>\n\n<article sc-camel-on-pointer-move=\"{{ move }}\" sc-camel-on-pointer-leave=\"{{ leave }}\" class=\"t a\" style=\"grid-column:1/span 7;grid-row:13/span 6\">\n<div class=\"meta mono\"><span>2026<\/span><span>Projet personnel<\/span><\/div>\n<h3>StageTracker<\/h3>\n<p>Une application pour organiser sa recherche de stage : suivi des candidatures envoyées par e-mail, relance automatique quelques jours après un premier contact avec une nouvelle entreprise, et gestion du projet de bout en bout. J'ai aussi rédigé le cahier des charges et le parcours utilisateur.<\/p>\n<div class=\"flow mono push\">candidature → relance à X jours → suivi<\/div>\n<ul class=\"tags\"><li>Vibe coding<\/li><li>Gestion de projet<\/li><\/ul>\n<a class=\"mono\" href=\"https://github.com/komafeu007/stageTracker\">github.com/komafeu007/stageTracker<\/a>\n<\/article>\n\n<section sc-camel-on-pointer-move=\"{{ move }}\" sc-camel-on-pointer-leave=\"{{ leave }}\" class=\"t w\" style=\"grid-column:1/span 5;grid-row:19/span 6\" id=\"parcours\">\n<div class=\"lbl\">Formation et expériences<\/div>\n<dl class=\"tl mono\">\n<div><dt>Depuis 2025<\/dt><dd>BUT Informatique, 2e année, IUT de Bordeaux. Parcours développement d'application : conception, validation, POO, réseaux.<\/dd><\/div>\n<div><dt>Depuis 2025<\/dt><dd>DU Robotique, 2e année, IUT de Bordeaux. Robots autonomes, capteurs, intelligence embarquée.<\/dd><\/div>\n<div><dt>2025<\/dt><dd>Stage au Ministère de l'Écologie, service de cybersécurité (1 semaine).<\/dd><\/div>\n<div><dt>2024<\/dt><dd>Stage chez Cap Ingelec, service DSI (1 semaine).<\/dd><\/div>\n<div><dt>2022 — 2024<\/dt><dd>Baccalauréat général, mention Bien. Mathématiques, physique-chimie, NSI. Lycée Jeanne d'Arc Assomption, Pessac.<\/dd><\/div>\n<div><dt>2022<\/dt><dd>Stage au Conseil départemental de la Gironde, service informatique (2 semaines).<\/dd><\/div>\n<\/dl>\n<\/section>\n\n<article sc-camel-on-pointer-move=\"{{ move }}\" sc-camel-on-pointer-leave=\"{{ leave }}\" class=\"t m\" style=\"grid-column:6/span 4;grid-row:19/span 3\">\n<div class=\"meta mono\"><span>2025 — 2026<\/span><span>Académique<\/span><\/div>\n<h3>Biosphere<\/h3>\n<p>Jeu de plateau à niveaux : interface graphique et moteur de règles pour le tour par tour. Puis une IA pour le concours inter-promotion.<\/p>\n<ul class=\"tags push\"><li>Java<\/li><li>Algorithmique<\/li><li>IA<\/li><\/ul>\n<\/article>\n\n<article sc-camel-on-pointer-move=\"{{ move }}\" sc-camel-on-pointer-leave=\"{{ leave }}\" class=\"t a\" style=\"grid-column:6/span 4;grid-row:22/span 3\">\n<div class=\"meta mono\"><span>2025<\/span><span>Hackathon<\/span><\/div>\n<h3>Main robotisée à contrôle haptique<\/h3>\n<p>Une prothèse qui reproduit en temps réel les mouvements de la main. Un gant à capteurs de flexion pilote des servomoteurs synchronisés.<\/p>\n<ul class=\"tags push\"><li>Arduino<\/li><li>Capteurs de flexion<\/li><li>Servomoteurs<\/li><\/ul>\n<\/article>\n\n<article sc-camel-on-pointer-move=\"{{ move }}\" sc-camel-on-pointer-leave=\"{{ leave }}\" class=\"t d\" style=\"grid-column:10/span 3;grid-row:19/span 6\">\n<div class=\"meta mono\"><span>2026<\/span><span>Académique, équipe de 4<\/span><\/div>\n<h3>Clone Pac-Man<\/h3>\n<p>Jeu d'arcade pour les Journées Portes Ouvertes de l'IUT. En lead developer et designer : structure du code, boucle de jeu, pilotage du projet.<\/p>\n<ul class=\"tags push\"><li>Java<\/li><li>Lead dev<\/li><li>Game design<\/li><\/ul>\n<\/article>\n\n<article sc-camel-on-pointer-move=\"{{ move }}\" sc-camel-on-pointer-leave=\"{{ leave }}\" class=\"t w\" style=\"grid-column:1/span 5;grid-row:25/span 3\">\n<div class=\"meta mono\"><span>2025<\/span><span>Académique<\/span><\/div>\n<h3>Odomo, dashboard météo<\/h3>\n<p>Interface graphique d'une station météo pour lire clairement les relevés des capteurs.<\/p>\n<ul class=\"tags push\"><li>Java<\/li><li>GUI<\/li><\/ul>\n<\/article>\n\n<section sc-camel-on-pointer-move=\"{{ move }}\" sc-camel-on-pointer-leave=\"{{ leave }}\" class=\"t k\" style=\"grid-column:1/span 5;grid-row:28/span 3;justify-content:center\">\n<a class=\"ln\" href=\"https://github.com/komafeu007\">GitHub : komafeu007<span aria-hidden=\"true\">↗<\/span><\/a>\n<a class=\"ln\" href=\"https://www.linkedin.com/in/foussat-ferr%C3%A9-simon-64945b42b\">LinkedIn : Simon Foussat-Ferré<span aria-hidden=\"true\">↗<\/span><\/a>\n<\/section>\n\n<article sc-camel-on-pointer-move=\"{{ move }}\" sc-camel-on-pointer-leave=\"{{ leave }}\" class=\"t v\" style=\"grid-column:6/span 4;grid-row:25/span 3\">\n<div class=\"meta mono\"><span>2025 — 2026<\/span><span>Projet personnel<\/span><\/div>\n<h3>Workstation Arch Linux<\/h3>\n<p>Installation et configuration sur mesure en dual-boot, pour isoler le travail et le développement de l'espace de loisir Windows.<\/p>\n<ul class=\"tags push\"><li>Arch Linux<\/li><li>Dual-boot<\/li><li>Administration système<\/li><\/ul>\n<\/article>\n\n<article sc-camel-on-pointer-move=\"{{ move }}\" sc-camel-on-pointer-leave=\"{{ leave }}\" class=\"t m\" style=\"grid-column:6/span 4;grid-row:28/span 3\">\n<div class=\"meta mono\"><span>2025<\/span><span>Académique<\/span><\/div>\n<h3>Refonte web<\/h3>\n<p>Un site institutionnel créé par les enseignants, modernisé : design, accessibilité, structure.<\/p>\n<ul class=\"tags push\"><li>HTML5<\/li><li>CSS3<\/li><\/ul>\n<\/article>\n\n<article sc-camel-on-pointer-move=\"{{ move }}\" sc-camel-on-pointer-leave=\"{{ leave }}\" class=\"t l\" style=\"grid-column:10/span 3;grid-row:25/span 6\">\n<div class=\"meta mono\"><span>2026<\/span><span>Projet personnel<\/span><\/div>\n<h3>Bras robotique et simulation 3D<\/h3>\n<p>Modèle CAO sous Onshape et simulation dynamique avec pyBullet d'un bras articulé, pour entraîner ensuite des algorithmes d'apprentissage par renforcement.<\/p>\n<ul class=\"tags push\"><li>Onshape<\/li><li>pyBullet<\/li><li>Simulation<\/li><li>Machine Learning<\/li><\/ul>\n<\/article>\n\n<article sc-camel-on-pointer-move=\"{{ move }}\" sc-camel-on-pointer-leave=\"{{ leave }}\" class=\"t v\" style=\"grid-column:1/span 12;grid-row:31/span 3\">\n<div class=\"meta mono\"><span>Application mobile<\/span><span>Hors ligne<\/span><\/div>\n<h3>AppSport Local<\/h3>\n<p>Application mobile de musculation développée en React Native (Expo, TypeScript) qui fonctionne entièrement hors ligne, avec un stockage local en SQLite. Elle crée un profil utilisateur (objectif, niveau, matériel, douleurs, fréquence, durée) puis génère automatiquement un programme d'entraînement sur-mesure grâce à un moteur de règles, sans aucune IA ni API externe. Pendant la séance, elle guide le chrono et les temps de repos, saisit les charges série par série, détecte les nouveaux records et restitue ensuite un récapitulatif complet (volume, progression, répartition par muscle).<\/p>\n<div class=\"flow mono push\">profil → moteur de règles → programme → séance → récapitulatif<\/div>\n<ul class=\"tags\"><li>React Native<\/li><li>Expo<\/li><li>TypeScript<\/li><li>SQLite<\/li><li>Vibe coding<\/li><li>Hors ligne<\/li><\/ul>\n<\/article>\n\n<section sc-camel-on-pointer-move=\"{{ move }}\" sc-camel-on-pointer-leave=\"{{ leave }}\" class=\"t d\" style=\"grid-column:1/span 4;grid-row:34/span 3;padding:22px\">\n<div class=\"lbl\">Développement<\/div>\n<ul class=\"list\"><li>Python<\/li><li>Java<\/li><li>C#<\/li><li>SQL<\/li><li>HTML, CSS, JS<\/li><li>Git, UML<\/li><\/ul>\n<\/section>\n\n<section sc-camel-on-pointer-move=\"{{ move }}\" sc-camel-on-pointer-leave=\"{{ leave }}\" class=\"t a\" style=\"grid-column:5/span 4;grid-row:34/span 3;padding:22px\">\n<div class=\"lbl\">Robotique et embarqué<\/div>\n<ul class=\"list\"><li>Capteurs<\/li><li>Arduino<\/li><li>ESP32<\/li><li>Raspberry Pi<\/li><li>Modélisation 3D<\/li><\/ul>\n<\/section>\n\n<section sc-camel-on-pointer-move=\"{{ move }}\" sc-camel-on-pointer-leave=\"{{ leave }}\" class=\"t l\" style=\"grid-column:9/span 4;grid-row:34/span 3;padding:22px\">\n<div class=\"lbl\">Systèmes et réseaux<\/div>\n<ul class=\"list\"><li>Linux, Arch<\/li><li>Proxmox<\/li><li>OpenMediaVault<\/li><li>Docker<\/li><li>Zigbee, ESP-NOW<\/li><\/ul>\n<\/section>\n\n<footer sc-camel-on-pointer-move=\"{{ move }}\" sc-camel-on-pointer-leave=\"{{ leave }}\" class=\"t hg\" style=\"grid-column:1/span 12;grid-row:37/span 4;justify-content:space-between\" id=\"contact\">\n<svg class=\"deco\" sc-camel-view-box=\"0 0 400 300\" aria-hidden=\"true\" style=\"right:40px;bottom:-90px\"><g stroke=\"#fff\" stroke-width=\"44\" stroke-linecap=\"round\"><path d=\"M80 80H200M200 80V200M200 200H330\"><\/path><\/g><g fill=\"#fff\"><circle cx=\"80\" cy=\"80\" r=\"62\"><\/circle><circle cx=\"200\" cy=\"200\" r=\"48\"><\/circle><circle cx=\"330\" cy=\"200\" r=\"62\"><\/circle><\/g><\/svg>\n<div class=\"big\">Je cherche un stage de 8 à 10 semaines en robotique, à partir de janvier. Écrivez-moi.<\/div>\n<a class=\"mail\" href=\"mailto:simonferre33@gmail.com\">simonferre33@gmail.com<\/a>\n<\/footer>\n\n<\/div><\/main><\/div>\n<\/x-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1360,&quot;height&quot;:3010}}\">\nclass Component extends DCLogic {\nrenderVals() {\nconst reduce = () => window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;\nconst move = (e) => {\nif (e.pointerType === 'touch' || reduce()) return;\nconst el = e.currentTarget, r = el.getBoundingClientRect();\nconst x = (e.clientX - r.left) / r.width - 0.5, y = (e.clientY - r.top) / r.height - 0.5;\nel.style.transform = 'perspective(900px) rotateX(' + (-y * 9).toFixed(2) + 'deg) rotateY(' + (x * 9).toFixed(2) + 'deg) scale(1.015)';\n};\nconst leave = (e) => { e.currentTarget.style.transform =
