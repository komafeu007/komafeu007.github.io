  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';

    // events at the element — warn only; real JS errors carry message/error.

      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

    const templateEl = document.querySelector('script[type="__bundler/template"]');

    // navigation stays same-origin with its initiator and a deduped page

    // navigated to by another).

    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop

    // an origin exists), and both directions are origin-gated (on https

    // opaque contexts — file:// — everything serializes as 'null', where

    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.

      : '*';
    function trustedOrigin(e) {

      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

            window.location.protocol === 'file:')) ||

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.

    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down

      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }

        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];

      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'

        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];

        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();

            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();

          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }

          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {

    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

n<\u002Fhelmet>\n<div class=\"pg\" data-canvas-width=\"1360\" data-canvas-height=\"3448\" data-document-role=\"page\" data-label=\"Portfolio · bento\"><main class=\"wrap\"><div class=\"grid {{ filtered }}\">\n\n<section class=\"topbar\" id=\"top\" aria-label=\"Disponibilité et filtre par domaine\">\n<span class=\"stage\"><span class=\"dot\" aria-hidden=\"true\"><\u002Fspan>Stage en robotique, 8 à 10 semaines, dès janvier<\u002Fspan>\n<span class=\"legend mono\" role=\"group\" aria-label=\"Filtrer les projets par domaine\"><button type=\"button\" class=\"lg robo\" data-disc=\"robo\" aria-pressed=\"{{ pressRobo }}\" sc-camel-on-click=\"{{ pick }}\"><span class=\"key\" aria-hidden=\"true\"><\u002Fspan>Robotique<\u002Fbutton><button type=\"button\" class=\"lg logi\" data-disc=\"logi\" aria-pressed=\"{{ pressLogi }}\" sc-camel-on-click=\"{{ pick }}\"><span class=\"key\" aria-hidden=\"true\"><\u002Fspan>Logiciel<\u002Fbutton><button type=\"button\" class=\"lg sys\" data-disc=\"sys\" aria-pressed=\"{{ pressSys }}\" sc-camel-on-click=\"{{ pick }}\"><span class=\"key\" aria-hidden=\"true\"><\u002Fspan>Systèmes<\u002Fbutton><button type=\"button\" class=\"lg form\" data-disc=\"form\" aria-pressed=\"{{ pressForm }}\" sc-camel-on-click=\"{{ pick }}\"><span class=\"key\" aria-hidden=\"true\"><\u002Fspan>Formation<\u002Fbutton><button type=\"button\" class=\"lg reset\" hidden=\"{{ noFilter }}\" sc-camel-on-click=\"{{ showAll }}\">Tout afficher<\u002Fbutton><\u002Fspan>\n<\u002Fsection>\n\n<section sc-camel-on-pointer-move=\"{{ move }}\" sc-camel-on-pointer-leave=\"{{ leave }}\" class=\"t teal hero\" style=\"grid-column:1/span 7;grid-row:2/span 6\">\n<h1>Je construis des logiciels, des serveurs et des robots.<\u002Fh1>\n<div class=\"heroStack\">\n<p class=\"sub\">Étudiant en double cursus informatique et robotique à l'IUT de Bordeaux. Je travaille à tous les niveaux, de l'application au microcontrôleur.<\u002Fp>\n<div class=\"cta\"><a class=\"btn fill\" href=\"#projets\" sc-camel-on-click=\"{{ showAll }}\">Voir mes projets<\u002Fa><a class=\"btn line\" href=\"#contact\">Me contacter<\u002Fa><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"t paper identity\" style=\"grid-column:8/span 5;grid-row:2/span 6\">\n<svg class=\"icv\" viewBox=\"0 0 140 118\" aria-hidden=\"true\"><g stroke=\"#101A1B\" stroke-width=\"3\" stroke-linecap=\"round\"><path d=\"M40 18V7M60 18V7M80 18V7M100 18V7M40 100V111M60 100V111M80 100V111M100 100V111\"><\u002Fpath><\u002Fg><rect x=\"28\" y=\"18\" width=\"84\" height=\"82\" rx=\"9\" fill=\"none\" stroke=\"#101A1B\" stroke-width=\"3\"><\u002Frect><circle cx=\"42\" cy=\"32\" r=\"3.6\" fill=\"#0E4B44\"><\u002Fcircle><text x=\"70\" y=\"62\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"16\" letter-spacing=\"1\" fill=\"#101A1B\">SF-F<\u002Ftext><text x=\"70\" y=\"79\" text-anchor=\"middle\" font-family=\"IBM Plex Mono, monospace\" font-size=\"9\" letter-spacing=\"2\" fill=\"#101A1B\" opacity=\".55\">2025<\u002Ftext><\u002Fsvg>\n<h2 class=\"name\">Simon Foussat-Ferré<\u002Fh2>\n<div class=\"idmeta\">BUT Informatique, 2e année<br>DU Robotique, 2e année<br>IUT de Bordeaux<br>Saint-Jean-d'Illac (33)<\u002Fdiv>\n<p class=\"quote\">J'aime comprendre un système en entier, de l'application au capteur. J'apprends surtout en construisant.<\u002Fp>\n<\u002Fsection>\n\n<div id=\"projets\" aria-hidden=\"true\" style=\"grid-column:1/-1;grid-row:8;height:0\"><\u002Fdiv>\n<article sc-camel-on-pointer-move=\"{{ move }}\" sc-camel-on-pointer-leave=\"{{ leave }}\" class=\"t tilt teal-t\" style=\"grid-column:1/span 3;grid-row:8/span 6\" hidden=\"{{ hideRobo }}\">\n<div class=\"meta\"><span class=\"disc\">Robotique<\u002Fspan><span class=\"when\"><span>2026<\u002Fspan><span class=\"src\">Hackathon<\u002Fspan><\u002Fspan><\u002Fdiv>\n<h2 class=\"tt\">Robot autonome de labyrinthe<\u002Fh2>\n<p>Un véhicule trouve seul la sortie d'un labyrinthe physique. Un LiDAR perçoit l'espace et des roues holonomes le déplacent dans toutes les directions.<\u002Fp>\n<ul class=\"tags push\"><li>Python<\u002Fli><li>LiDAR<\u002Fli><li>Holonome<\u002Fli><\u002Ful>\n<\u002Farticle>\n\n<article sc-camel-on-pointer-move=\"{{ move }}\" sc-camel-on-pointer-leave=\"{{ leave }}\" class=\"t tilt indigo\" style=\"grid-column:4/span 4;grid-row:8/span 6\" hidden=\"{{ hideLogi }}\">\n<div class=\"meta\"><span class=\"disc\">Logiciel<\u002Fspan><span class=\"when\"><span>2026<\u002Fspan><span class=\"src\">Équipe de 5<\u002Fspan><\u002Fspan><\u002Fdiv>\n<h2 class=\"tt\">Visualisation météo et incidents climatiques<\u002Fh2>\n<p>Le projet analyse des données météo et des incidents climatiques, dont les feux de forêt, à partir de bases de données de l'État. Le traitement et la base sont séparés de l'affichage client. Je me suis occupé de la partie statistique.<\u002Fp>\n<div class=\"flow push\">SQL → Python (back) → C# (front)<\u002Fdiv>\n<ul class=\"tags\"><li>Python<\u002Fli><li>C#<\u002Fli><li>SQL<\u002Fli><li>Statistiques<\u002Fli><\u002Ful>\n<\u002Farticle>\n\n<article sc-camel-on-pointer-move=\"{{ move }}\" sc-camel-on-pointer-leave=\"{{ leave }}\" class=\"t tilt graphite lead\" style=\"grid-column:8/span 5;grid-row:8/span 6\" hidden=\"{{ hideSys }}\">\n<div class=\"meta\"><span class=\"disc\">Systèmes<\u002Fspan><span class=\"when\"><span>2023 à 2026<\u002Fspan><span class=\"src\">Personnel<\u002Fspan><\u002Fspan><\u002Fdiv>\n<h2 class=\"tt\">Serveur domestique et domotique<\u002Fh2>\n<p>Une ancienne machine reconditionnée sous Proxmox. Des conteneurs Docker font tourner un NAS (OpenMediaVault), un serveur multimédia et Home Assistant pour la domotique.<\u002Fp>\n<ul class=\"stack\"><li><span>hôte<\u002Fspan>Proxmox<\u002Fli><li><span>conteneurs<\u002Fspan>Docker<\u002Fli><li><span>services<\u002Fspan>NAS, médias, domotique<\u002Fli><\u002Ful>\n<ul class=\"tags\"><li>Proxmox<\u002Fli><li>Docker<\u002Fli><li>OMV<\u002Fli><li>Home Assistant<\u002Fli><\u002Ful>\n<\u002Farticle>\n\n<article sc-camel-on-pointer-move=\"{{ move }}\" sc-camel-on-pointer-leave=\"{{ leave }}\" class=\"t tilt indigo-t\" style=\"grid-column:1/span 7;grid-row:14/span 6\" hidden=\"{{ hideLogi }}\">\n<div class=\"meta\"><span class=\"disc\">Logiciel<\u002Fspan><span class=\"when\"><span>2026<\u002Fspan><span class=\"src\">Personnel<\u002Fspan><\u002Fspan><\u002Fdiv>\n<h2 class=\"tt\">StageTracker<\u002Fh2>\n<p>Une application pour organiser sa recherche de stage. Elle suit les candidatures envoyées par e-mail et relance automatiquement quelques jours après un premier contact avec une nouvelle entreprise. J'ai géré le projet et rédigé le cahier des charges et le parcours utilisateur.<\u002Fp>\n<div class=\"flow push\">candidature → relance à X jours → suivi<\u002Fdiv>\n<ul class=\"tags\"><li>Vibe coding<\u002Fli><li>Gestion de projet<\u002Fli><\u002Ful>\n<a class=\"inline\" href=\"https://github.com/komafeu007/stageTracker\">github.com/komafeu007/stageTracker<\u002Fa>\n<\u002Farticle>\n\n<article sc-camel-on-pointer-move=\"{{ move }}\" sc-camel-on-pointer-leave=\"{{ leave }}\" class=\"t tilt teal\" style=\"grid-column:8/span 5;grid-row:14/span 6\" hidden=\"{{ hideRobo }}\">\n<div class=\"meta\"><span class=\"disc\">Robotique<\u002Fspan><span class=\"when\"><span>2026<\u002Fspan><span class=\"src\">Personnel<\u002Fspan><\u002Fspan><\u002Fdiv>\n<h2 class=\"tt\">Station météo modulaire<\u002Fh2>\n<p>Mesurer la météo dedans et dehors, sans câble. Deux pods, un à l'intérieur et un à l'extérieur, envoient leurs relevés en ESP-NOW avec une latence très faible vers un écran central. Les données s'affichent aussi dans Home Assistant. Le pod extérieur est en place depuis août 2026.<\u002Fp>\n<div class=\"flow push\">pod intérieur + pod extérieur → ESP-NOW → écran central<\u002Fdiv>\n<ul class=\"tags\"><li>Arduino<\u002Fli><li>ESP-NOW<\u002Fli><li>ESPHome<\u002Fli><li>IoT<\u002Fli><\u002Ful>\n<a class=\"inline\" href=\"https://github.com/komafeu007/Weather-station\">github.com/komafeu007/Weather-station<\u002Fa>\n<\u002Farticle>\n\n<section class=\"t sand\" style=\"grid-column:1/span 5;grid-row:20/span 6\" id=\"parcours\" hidden=\"{{ hideForm }}\">\n<h2 class=\"sec\"><span class=\"key form\" aria-hidden=\"true\"><\u002Fspan>Formation et expériences<\u002Fh2>\n<dl class=\"log\">\n<div><dt>Depuis 2025<\u002Fdt><dd>BUT Informatique, 2e année, IUT de Bordeaux. Parcours développement d'application : conception, validation, POO et réseaux.<\u002Fdd><\u002Fdiv>\n<div><dt>Depuis 2025<\u002Fdt><dd>DU Robotique, 2e année, IUT de Bordeaux. Robots autonomes, capteurs et intelligence embarquée.<\u002Fdd><\u002Fdiv>\n<div><dt>2025<\u002Fdt><dd>Stage au Ministère de l'Écologie, service de cybersécurité (1 semaine).<\u002Fdd><\u002Fdiv>\n<div><dt>2024<\u002Fdt><dd>Stage chez Cap Ingelec, service DSI (1 semaine).<\u002Fdd><\u002Fdiv>\n<div><dt>2022 à 2024<\u002Fdt><dd>Baccalauréat général, mention Bien. Mathématiques, physique-chimie et NSI. Lycée Jeanne d'Arc Assomption, Pessac.<\u002Fdd><\u002Fdiv>\n<div><dt>2022<\u002Fdt><dd>Stage au Conseil départemental de la Gironde, service informatique (2 semaines).<\u002Fdd><\u002Fdiv>\n<\u002Fdl>\n<\u002Fsection>\n\n<article sc-camel-on-pointer-move=\"{{ move }}\" sc-camel-on-pointer-leave=\"{{ leave }}\" class=\"t tilt indigo-t\" style=\"grid-column:6/span 4;grid-row:20/span 3\" hidden=\"{{ hideLogi }}\">\n<div class=\"meta\"><span class=\"disc\">Logiciel<\u002Fspan><span class=\"when\"><span>2025 à 2026<\u002Fspan><span class=\"src\">Académique<\u002Fspan><\u002Fspan><\u002Fdiv>\n<h2 class=\"tt\">Biosphere<\u002Fh2>\n<p>Jeu de plateau à niveaux, avec une interface graphique et un moteur de règles pour le tour par tour. J'ai ensuite ajouté une IA pour le concours inter-promotion.<\u002Fp>\n<ul class=\"tags push\"><li>Java<\u002Fli><li>Algorithmique<\u002Fli><li>IA<\u002Fli><\u002Ful>\n<\u002Farticle>\n\n<article sc-camel-on-pointer-move=\"{{ move }}\" sc-camel-on-pointer-leave=\"{{ leave }}\" class=\"t tilt teal-t\" style=\"grid-column:6/span 4;grid-row:23/span 3\" hidden=\"{{ hideRobo }}\">\n<div class=\"meta\"><span class=\"disc\">Robotique<\u002Fspan><span class=\"when\"><span>2025<\u002Fspan><span class=\"src\">Hackathon<\u002Fspan><\u002Fspan><\u002Fdiv>\n<h2 class=\"tt\">Main robotisée à contrôle haptique<\u002Fh2>\n<p>Une prothèse qui reproduit en temps réel les mouvements de la main. Un gant équipé de capteurs de flexion pilote des servomoteurs synchronisés.<\u002Fp>\n<ul class=\"tags push\"><li>Arduino<\u002Fli><li>Capteurs de flexion<\u002Fli><li>Servomoteurs<\u002Fli><\u002Ful>\n<\u002Farticle>\n\n<article sc-camel-on-pointer-move=\"{{ move }}\" sc-camel-on-pointer-leave=\"{{ leave }}\" class=\"t tilt indigo\" style=\"grid-column:10/span 3;grid-row:20/span 6\" hidden=\"{{ hideLogi }}\">\n<div class=\"meta\"><span class=\"disc\">Logiciel<\u002Fspan><span class=\"when\"><span>2026<\u002Fspan><span class=\"src\">Équipe de 4<\u002Fspan><\u002Fspan><\u002Fdiv>\n<h2 class=\"tt\">Clone Pac-Man<\u002Fh2>\n<p>Jeu d'arcade pour les Journées Portes Ouvertes de l'IUT. J'étais lead developer et designer : j'ai défini la structure du code, écrit la boucle de jeu et piloté le projet.<\u002Fp>\n<ul class=\"tags push\"><li>Java<\u002Fli><li>Lead dev<\u002Fli><li>Game design<\u002Fli><\u002Ful>\n<\u002Farticle>\n\n<article sc-camel-on-pointer-move=\"{{ move }}\" sc-camel-on-pointer-leave=\"{{ leave }}\" class=\"t tilt paper\" style=\"grid-column:1/span 5;grid-row:26/span 3\" hidden=\"{{ hideLogi }}\">\n<div class=\"meta\"><span class=\"disc\">Logiciel<\u002Fspan><span class=\"when\"><span>2025<\u002Fspan><span class=\"src\">Académique<\u002Fspan><\u002Fspan><\u002Fdiv>\n<h2 class=\"tt\">Odomo, dashboard météo<\u002Fh2>\n<p>Interface graphique d'une station météo pour lire les relevés des capteurs.<\u002Fp>\n<ul class=\"tags push\"><li>Java<\u002Fli><li>GUI<\u002Fli><\u002Ful>\n<\u002Farticle>\n\n<article sc-camel-on-pointer-move=\"{{ move }}\" sc-camel-on-pointer-leave=\"{{ leave }}\" class=\"t tilt graphite\" style=\"grid-column:1/span 5;grid-row:29/span 3\" hidden=\"{{ hideSys }}\">\n<div class=\"meta\"><span class=\"disc\">Systèmes<\u002Fspan><span class=\"when\"><span>2026<\u002Fspan><span class=\"src\">Personnel<\u002Fspan><\u002Fspan><\u002Fdiv>\n<h2 class=\"tt\">IA locale et OpenCode<\u002Fh2>\n<p>Un modèle de langage installé en local, quantifié pour tenir dans la mémoire et la carte graphique de la machine. Aucun appel à un service externe&nbsp;: je m'en sers avec OpenCode pour écrire et relire du code.<\u002Fp>\n<ul class=\"tags push\"><li>LLM local<\u002Fli><li>OpenCode<\u002Fli><li>Quantisation<\u002Fli><li>Hors ligne<\u002Fli><\u002Ful>\n<\u002Farticle>\n\n<article sc-camel-on-pointer-move=\"{{ move }}\" sc-camel-on-pointer-leave=\"{{ leave }}\" class=\"t tilt graphite-t\" style=\"grid-column:6/span 4;grid-row:26/span 3\" hidden=\"{{ hideSys }}\">\n<div class=\"meta\"><span class=\"disc\">Systèmes<\u002Fspan><span class=\"when\"><span>2025 à 2026<\u002Fspan><span class=\"src\">Personnel<\u002Fspan><\u002Fspan><\u002Fdiv>\n<h2 class=\"tt\">Workstation Arch Linux<\u002Fh2>\n<p>Installation et configuration en dual-boot, pour séparer le travail et le développement de l'espace de loisir sous Windows.<\u002Fp>\n<ul class=\"tags push\"><li>Arch Linux<\u002Fli><li>Dual-boot<\u002Fli><li>Administration système<\u002Fli><\u002Ful>\n<\u002Farticle>\n\n<article sc-camel-on-pointer-move=\"{{ move }}\" sc-camel-on-pointer-leave=\"{{ leave }}\" class=\"t tilt indigo-t\" style=\"grid-column:6/span 4;grid-row:29/span 3\" hidden=\"{{ hideLogi }}\">\n<div class=\"meta\"><span class=\"disc\">Logiciel<\u002Fspan><span class=\"when\"><span>2025<\u002Fspan><span class=\"src\">Académique<\u002Fspan><\u002Fspan><\u002Fdiv>\n<h2 class=\"tt\">Refonte web<\u002Fh2>\n<p>Un site institutionnel créé par les enseignants. Nous avons retravaillé le design, l'accessibilité et la structure des pages.<\u002Fp>\n<ul class=\"tags push\"><li>HTML5<\u002Fli><li>CSS3<\u002Fli><\u002Ful>\n<\u002Farticle>\n\n<article sc-camel-on-pointer-move=\"{{ move }}\" sc-camel-on-pointer-leave=\"{{ leave }}\" class=\"t tilt teal\" style=\"grid-column:10/span 3;grid-row:26/span 6\" hidden=\"{{ hideRobo }}\">\n<div class=\"meta\"><span class=\"disc\">Robotique<\u002Fspan><span class=\"when\"><span>2026<\u002Fspan><span class=\"src\">Personnel<\u002Fspan><\u002Fspan><\u002Fdiv>\n<h2 class=\"tt\">Bras robotique et simulation 3D<\u002Fh2>\n<p>Modèle CAO d'un bras articulé sous Onshape, puis simulation dynamique avec pyBullet. L'objectif est d'y entraîner des algorithmes d'apprentissage par renforcement.<\u002Fp>\n<ul class=\"tags push\"><li>Onshape<\u002Fli><li>pyBullet<\u002Fli><li>Simulation<\u002Fli><li>Machine Learning<\u002Fli><\u002Ful>\n<\u002Farticle>\n\n<article sc-camel-on-pointer-move=\"{{ move }}\" sc-camel-on-pointer-leave=\"{{ leave }}\" class=\"t tilt indigo\" style=\"grid-column:1/span 6;grid-row:32/span 3\" hidden=\"{{ hideLogi }}\">\n<div class=\"meta\"><span class=\"disc\">Logiciel<\u002Fspan><span class=\"when\"><span>Application mobile<\u002Fspan><span class=\"src\">Hors ligne<\u002Fspan><\u002Fspan><\u002Fdiv>\n<h2 class=\"tt\">Arny<\u002Fh2>\n<p>Application mobile de musculation en React Native (Expo, TypeScript). Elle fonctionne hors ligne et stocke les données en SQLite. Un moteur de règles génère un programme adapté, sans IA ni API externe. Pendant la séance, l'app gère le chrono, les temps de repos, enregistre les charges série par série et signale les nouveaux records.<\u002Fp>\n<div class=\"rail\">\n<div class=\"flow\">profil → moteur de règles → programme → séance → récapitulatif<\u002Fdiv>\n<ul class=\"tags\"><li>React Native<\u002Fli><li>Expo<\u002Fli><li>TypeScript<\u002Fli><li>SQLite<\u002Fli><li>Vibe coding<\u002Fli><li>Hors ligne<\u002Fli><\u002Ful>\n<a class=\"inline\" href=\"https://github.com/komafeu007/AppSport\">github.com/komafeu007/AppSport<\u002Fa>\n<\u002Fdiv>\n<\u002Farticle>\n\n<article sc-camel-on-pointer-move=\"{{ move }}\" sc-camel-on-pointer-leave=\"{{ leave }}\" class=\"t tilt indigo-t\" style=\"grid-column:7/span 6;grid-row:32/span 3\" hidden=\"{{ hideLogi }}\">\n<div class=\"meta\"><span class=\"disc\">Logiciel<\u002Fspan><span class=\"when\"><span>Application mobile<\u002Fspan><span class=\"src\">Hors ligne<\u002Fspan><\u002Fspan><\u002Fdiv>\n<h2 class=\"tt\">Collecty<\u002Fh2>\n<p>Application mobile pour gérer ses collections d'objets, figurines ou boissons par exemple. Pour chaque objet, on ajoute un nom, une photo, une note sur 10 et un commentaire. L'app calcule la moyenne de chaque collection. Les données sont stockées sur un petit serveur chez soi, sur le réseau local, et se synchronisent entre plusieurs appareils avec le même compte. Elles restent consultables hors ligne.<\u002Fp>\n<div class=\"rail\">\n<ul class=\"tags\"><li>React Native<\u002Fli><li>Expo<\u002Fli><li>TypeScript<\u002Fli><li>Hors ligne<\u002Fli><li>Serveur local<\u002Fli><li>Vibe coding<\u002Fli><\u002Ful>\n<\u002Fdiv>\n<\u002Farticle>\n\n<section class=\"t paper skills\" style=\"grid-column:1/span 4;grid-row:35/span 3\" hidden=\"{{ hideLogi }}\">\n<h2 class=\"sec\"><span class=\"key logi\" aria-hidden=\"true\"><\u002Fspan>Développement<\u002Fh2>\n<ul class=\"spec\"><li>Python<\u002Fli><li>Java<\u002Fli><li>C#<\u002Fli><li>SQL<\u002Fli><li>HTML, CSS, JS<\u002Fli><li>Git, UML<\u002Fli><\u002Ful>\n<\u002Fsection>\n\n<section class=\"t paper skills\" style=\"grid-column:5/span 4;grid-row:35/span 3\" hidden=\"{{ hideRobo }}\">\n<h2 class=\"sec\"><span class=\"key robo\" aria-hidden=\"true\"><\u002Fspan>Robotique et embarqué<\u002Fh2>\n<ul class=\"spec\"><li>Capteurs<\u002Fli><li>Arduino<\u002Fli><li>ESP32<\u002Fli><li>Raspberry Pi<\u002Fli><li>Modélisation 3D<\u002Fli><\u002Ful>\n<\u002Fsection>\n\n<section class=\"t paper skills\" style=\"grid-column:9/span 4;grid-row:35/span 3\" hidden=\"{{ hideSys }}\">\n<h2 class=\"sec\"><span class=\"key sys\" aria-hidden=\"true\"><\u002Fspan>Systèmes et réseaux<\u002Fh2>\n<ul class=\"spec\"><li>Linux, Arch<\u002Fli><li>Proxmox<\u002Fli><li>OpenMediaVault<\u002Fli><li>Docker<\u002Fli><li>Zigbee, ESP-NOW<\u002Fli><li>IA locale, OpenCode<\u002Fli><\u002Ful>\n<\u002Fsection>\n\n<footer class=\"t graphite foot\" style=\"grid-column:1/span 12;grid-row:38/span 4\" id=\"contact\">\n<p class=\"big\">Je cherche un stage de 8 à 10 semaines en robotique, à partir de janvier. Écrivez-moi.<\u002Fp>\n<a class=\"mail\" href=\"mailto:simonferre33@gmail.com\">simonferre33@gmail.com<\u002Fa>\n<nav class=\"links\" aria-label=\"Liens et contact\"><a class=\"lnk\" href=\"https://github.com/komafeu007\">GitHub : komafeu007<\u002Fa><a class=\"lnk\" href=\"https://www.linkedin.com/in/foussat-ferr%C3%A9-simon-64945b42b\">LinkedIn : Simon Foussat-Ferré<\u002Fa><a class=\"lnk\" href=\"mailto:simonferre33@gmail.com\">E-mail<\u002Fa><a class=\"lnk\" href=\"#top\">Retour en haut<\u002Fa><\u002Fnav>\n<\u002Ffooter>\n\n<\u002Fdiv><\u002Fmain><\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1360,&quot;height&quot;:3350}}\">\nclass Component extends DCLogic {\nconstructor(props) {\nsuper(props);\nthis.state = { filter: null };\n}\npick(e) {\nconst d = e.currentTarget.getAttribute('data-disc');\nthis.setState({ filter: this.state.filter === d ? null : d });\n}\nclear() { this.setState({ filter: null }); }\nrenderVals() {\nconst reduce = () => window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;\nconst move = (e) => {\nif (e.pointerType === 'touch' || reduce()) return;\nconst el = e.currentTarget, r = el.getBoundingClientRect();\nconst x = (e.clientX - r.left) / r.width - 0.5, y = (e.clientY - r.top) / r.height - 0.5;\nel.style.transform = 'perspective(1100px) rotateX(' + (-y * 2.4).toFixed(2) + 'deg) rotateY(' + (x * 2.4).toFixed(2) + 'deg) translateY(-2px)';\n};\nconst leave = (e) => { e.currentTarget.style.transform = ''; };\nconst f = this.state.filter;\nconst hide = (d) => !!f && f !== d;\nconst press = (d) => (f === d ? 'true' : 'false');\nreturn {\nmove, leave,\npick: (e) => this.pick(e),\nshowAll: () => this.clear(),\nfiltered: f ? 'filtering' : '',\nnoFilter: !f,\npressRobo: press('robo'),\npressLogi: press('logi'),\npressSys: press('sys'),\npressForm: press('form'),\nhideRobo: hide('robo'),\nhideLogi: hide('logi'),\nhideSys: hide('sys'),\nhideForm: hide('form')\n};\n}\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>\n"
</script>
